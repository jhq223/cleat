[package]
name = "cleat"
version = "0.3.0"
edition = "2024"
description = "Android IL2CPP game modding toolkit with reflection, translation, coroutines, and Frida Gum hooks"
authors = ["jhq223 <jhq223@gmail.com>"]
license = "MIT"
repository = "https://github.com/jhq223/cleat"
readme = "README.md"
documentation = "https://docs.rs/cleat"
keywords = ["android", "il2cpp", "game-modding", "unity", "hooking"]
categories = ["game-development", "development-tools::ffi"]

[dependencies]
il2cpp-bridge-rs = { path = "crates/il2cpp-bridge-rs" }
log = "0.4"
thiserror = "2"
libc = "0.2"
async-task = "4.7"
concurrent-queue = "2.5"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"], optional = true }
yaxpeax-arm = { version = "0.5", optional = true }
yaxpeax-arch = { version = "0.3", optional = true }
bumpalo = { version = "3", optional = true }
genawaiter = { version = "0.99", default-features = false, optional = true }

cleat-macros = { path = "./cleat-macros", version = "0.1.0" }

[features]
default = []
class-injection = ["dep:iced-x86", "dep:yaxpeax-arm", "dep:yaxpeax-arch", "dep:bumpalo", "dep:genawaiter"]
unity-2019-4 = ["class-injection"]
unity-2020-3 = ["class-injection"]
unity-2021-3 = ["class-injection"]
unity-2022-3 = ["class-injection"]
unity-2023-1 = ["class-injection", "il2cpp-bridge-rs/unity-2023"]
# Unity 6 public APIs use pointer-sized GC handles. Its private class layout is
# deliberately not shared with 2023.1; class injection needs a separate profile.
unity-6000 = ["il2cpp-bridge-rs/unity-2023"]

[package.metadata.docs.rs]
features = ["unity-2022-3"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.22.4"

[build-dependencies]
cc = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
lzma-rust2 = "0.16"
tar = "0.4"
sha2 = "0.11"

[workspace]
members = ["cleat-macros", "crates/il2cpp-bridge-rs"]
resolver = "3"

[[example]]
name = "translation"
crate-type = ["cdylib"]

[[example]]
name = "runtime_probe"
crate-type = ["cdylib"]

[[example]]
name = "injection"
crate-type = ["cdylib"]
required-features = ["class-injection"]
